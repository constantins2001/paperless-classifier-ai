[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperless-classifier-ai"
version = "0.4.1"
description = "Conservative Paperless-ngx Inbox classifier using OpenAI-compatible vision models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Constantin Schreiber" }]
keywords = ["paperless-ngx", "paperless", "lm-studio", "document-classification", "local-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/constantins2001/paperless-classifier-ai"
Repository = "https://github.com/constantins2001/paperless-classifier-ai"

[project.optional-dependencies]
vision = ["PyMuPDF>=1.24"]

[project.scripts]
paperless-classifier-ai = "paperless_lmstudio_classifier:main"

[tool.setuptools]
py-modules = ["paperless_lmstudio_classifier"]
